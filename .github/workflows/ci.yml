name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # riscv-tests commit the suite was verified against.
  RISCV_TESTS_REF: 3df703cd52d5f0d8224e3c50bf03c6cb70efff98

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build riscv-tests (rv32ui)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
          git init -q /tmp/riscv-tests
          cd /tmp/riscv-tests
          git remote add origin https://github.com/riscv-software-src/riscv-tests.git
          git fetch -q --depth 1 origin "$RISCV_TESTS_REF"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1
          cd "$GITHUB_WORKSPACE"
          scripts/build-riscv-tests.sh /tmp/riscv-tests /tmp/rv32ui

      - name: Test (unit + programs + rv32ui compliance + web)
        run: cargo test --workspace -- --nocapture
        env:
          RISCV_TESTS_DIR: /tmp/rv32ui

      - name: Build WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p rv32i-sim-web --release --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/release/rv32i_sim_web.wasm
